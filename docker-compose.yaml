version: "3.8"

services: 
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  backend: 
    image: shevua/conduit-backend:latest
    restart: always
    environment:
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3001
    expose: 
      - "3001"
    depends_on:
      - db
  
  frontend:
    image: shevua/conduit-frontend:latest
    restart: always
    environment: 
      REACT_APP_BACKEND_URL: /api
    expose:
      - "3000"
    depends_on:
      - backend
  
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
    
services: 
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${PROD_DB_USERNAME}
      POSTGRES_USER: ${PROD_DB_PASSWORD}
      POSTGRES_DB: ${PROD_DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  backend: 
    image: ${DOCKER_HUB_USER}/${BACKEND_IMAGE}:${BUILD_NUMBER}
    restart: always
    environment:
      NODE_ENV: 'production'
      PROD_DB_HOSTNAME: 'db'
      PROD_DB_DIALECT: 'postgres'
      PROD_DB_LOGGIN: 'false'
      PORT: 3001
    expose: 
      - "3001"
    depends_on:
      - db
  
  frontend:
    image: ${DOCKER_HUB_USER}/${FRONTEND_IMAGE}:${BUILD_NUMBER}
    restart: always
    environment: 
      REACT_APP_BACKEND_URL: /api
    expose:
      - "3000"
    depends_on:
      - backend
  
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
    